<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookMyShow - Now Showing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      🎬 <span>BookMyShow</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <div class="container">
    <h1 class="page-title">🍿 Now Showing Movies</h1>
    
    <div id="loading" class="spinner"></div>
    <div class="movie-grid" id="movieGrid"></div>
  </div>

  <script>
    async function fetchMovies() {
      const loading = document.getElementById('loading');
      const movieGrid = document.getElementById('movieGrid');

      try {
        const response = await fetch('/api/movies');
        const data = await response.json();

        loading.style.display = 'none';

        if (!data.success || !data.movies) {
          movieGrid.innerHTML = '<p>Failed to load movies.</p>';
          return;
        }

        data.movies.forEach(movie => {
          const card = document.createElement('div');
          card.classList.add('movie-card');
          card.onclick = () => {
            localStorage.setItem('selectedMovieId', movie.id);
            window.location.href = `movie.html?id=${movie.id}`;
          };

          card.innerHTML = `
            <img src="${movie.poster}" alt="${movie.title}" class="movie-poster" />
            <div class="movie-info">
              <div class="movie-title">${movie.title}</div>
              <div class="movie-meta">
                <span>${movie.duration || '2h'}</span>
                <span class="movie-rating">⭐ ${movie.rating}</span>
              </div>
              <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">${movie.genre}</div>
            </div>
          `;
          movieGrid.appendChild(card);
        });
      } catch (error) {
        console.error('Error fetching movies:', error);
        loading.style.display = 'none';
        movieGrid.innerHTML = '<p>Unable to connect to backend server. Make sure node server.js is running!</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', fetchMovies);
  </script>
</body>
</html>
